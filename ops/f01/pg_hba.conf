# Tenant logins never use the trusted local bootstrap socket or system databases.
local all /^rag_t_[0-9a-f]{32}_(app|migrator|readonly)$ reject
local all all trust
hostssl postgres,template0,template1,rag_control,f01_vector_template /^rag_t_[0-9a-f]{32}_(app|migrator|readonly)$ all reject
hostssl all all all scram-sha-256
hostnossl all all all reject
