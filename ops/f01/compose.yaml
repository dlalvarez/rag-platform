name: rag-f01-dev
services:
  openbao:
    image: ghcr.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    user: "${RAG_F01_UID:?Prepare F01}:${RAG_F01_GID:?Prepare F01}"
    entrypoint: ["/usr/bin/bao"]
    command: ["server", "-config=/bao/config/openbao.hcl"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /bao/tls/ca.crt
    volumes:
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/raft
        target: /bao/data
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/config/openbao.hcl
        target: /bao/config/openbao.hcl
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/tls/openbao.crt
        target: /bao/tls/server.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/tls/openbao.key
        target: /bao/tls/server.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/tls/ca.crt
        target: /bao/tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
    networks: [f01]
    cpus: 0.5
    mem_limit: 768m
    memswap_limit: 768m
    ulimits:
      core: {soft: 0, hard: 0}
    # Sealed/uninitialized is never considered an available secret store.
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: f01_bootstrap
      POSTGRES_DB: rag_control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -o postgres -g postgres -m 600 /tls/server.key /tmp/f01-postgres.key
        exec /usr/local/bin/docker-entrypoint.sh postgres -c ssl=on -c ssl_min_protocol_version=TLSv1.3 -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tmp/f01-postgres.key -c hba_file=/tls/pg_hba.conf -c max_connections=30 -c shared_buffers=128MB
    secrets: [postgres_password]
    volumes:
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/postgres
        target: /var/lib/postgresql/data
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/tls/postgres.crt
        target: /tls/server.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/tls/postgres.key
        target: /tls/server.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/config/pg_hba.conf
        target: /tls/pg_hba.conf
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U f01_bootstrap -d rag_control"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [f01]
    cpus: 0.5
    mem_limit: 1536m
    memswap_limit: 1536m
  postgres2:
    profiles: [t006]
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: f01_bootstrap
      POSTGRES_DB: rag_control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres2_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -o postgres -g postgres -m 600 /tls/server.key /tmp/f01-postgres.key
        exec /usr/local/bin/docker-entrypoint.sh postgres -c ssl=on -c ssl_min_protocol_version=TLSv1.3 -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tmp/f01-postgres.key -c hba_file=/tls/pg_hba.conf -c max_connections=15 -c shared_buffers=64MB
    secrets: [postgres2_password]
    volumes:
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/postgres2
        target: /var/lib/postgresql/data
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/tls/postgres2.crt
        target: /tls/server.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/tls/postgres2.key
        target: /tls/server.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/config/pg_hba.conf
        target: /tls/pg_hba.conf
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U f01_bootstrap -d rag_control"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [f01]
    cpus: 0.25
    mem_limit: 512m
    memswap_limit: 512m
  tools:
    profiles: [tools]
    image: rag-f01-tools:t007
    build:
      context: ../..
      dockerfile: ops/f01/tools.Dockerfile
    user: "${RAG_F01_UID:?Prepare F01}:${RAG_F01_GID:?Prepare F01}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /run/f01-ca.crt
    volumes:
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/tls/ca.crt
        target: /run/f01-ca.crt
        read_only: true
        bind: {create_host_path: false}
    networks: [f01]
    cpus: 0.5
    mem_limit: 768m
    memswap_limit: 768m
    ulimits:
      core: {soft: 0, hard: 0}
  control-check:
    extends: tools
    profiles: [test]
    secrets: [postgres_password, control_migrator_password]
    command: [python, scripts/f01_control_check.py]
  sql-check:
    extends: tools
    profiles: [test]
    secrets: [postgres_password, control_migrator_password]
    command: [python, scripts/f01_sql_check.py]
  minio:
    image: rag-f00-minio:RELEASE.2025-10-15T17-29-55Z
    user: "${RAG_F01_UID:?Prepare F01}:${RAG_F01_GID:?Prepare F01}"
    command: ["--quiet", "--anonymous", "--certs-dir", "/certs", "server", "/data"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/storage_admin_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/storage_admin_password
      MINIO_BROWSER: "off"
    secrets: [storage_admin_user, storage_admin_password]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/minio
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/tls/minio/public.crt
        target: /certs/public.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/tls/minio/private.key
        target: /certs/private.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F01_ROOT:?Prepare F01}/tls/ca.crt
        target: /run/f01-ca.crt
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, -c, "import ssl,urllib.request; urllib.request.urlopen('https://minio:9000/minio/health/ready',context=ssl.create_default_context(cafile='/run/f01-ca.crt'),timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
    networks: [f01]
    cpus: 0.5
    mem_limit: 1536m
    memswap_limit: 1536m
    ulimits:
      core: {soft: 0, hard: 0}
  s3-compat:
    extends: tools
    profiles: [test]
    secrets: [storage_admin_user, storage_admin_password]
    command: [python, scripts/f01_storage_check.py, compatibility]
  s3-check:
    extends: tools
    profiles: [test]
    secrets: [storage_admin_user, storage_admin_password, control_migrator_password]
    command: [python, scripts/f01_storage_check.py, tenants]
  saga-check:
    extends: tools
    profiles: [test]
    secrets: [storage_admin_user, storage_admin_password, control_migrator_password]
    command: [python, scripts/f01_saga_check.py]

  pool-check:
    extends: tools
    profiles: [test]
    secrets: [control_migrator_password]
    command: [python, scripts/f01_pool_check.py]

  isolation-check:
    extends: tools
    profiles: [test]
    secrets: [postgres2_password, control_migrator_password, storage_admin_user, storage_admin_password]
    command: [python, scripts/f01_isolation_check.py]

  migration-calibrate:
    extends: tools
    profiles: [test]
    secrets: [postgres2_password]
    command: [python, scripts/f01_migration_calibrate.py]

  admin:
    extends: tools
    profiles: [admin]
    secrets: [control_migrator_password, storage_admin_user, storage_admin_password]
    entrypoint: [python, scripts/f01_admin.py]
    command: [--help]
  admin-read:
    extends: tools
    profiles: [admin]
    secrets: [control_migrator_password]
    entrypoint: [python, scripts/f01_admin.py]
    command: [--help]
  cli-check:
    extends: tools
    profiles: [test]
    secrets: [control_migrator_password, storage_admin_user, storage_admin_password]
    command: [python, scripts/f01_cli_check.py]

networks:
  f01:
    internal: true
secrets:
  postgres_password:
    file: ${RAG_F01_ROOT:?Prepare F01}/secrets/postgres_password
  control_migrator_password:
    file: ${RAG_F01_ROOT:?Prepare F01}/secrets/control_migrator_password

  storage_admin_user:
    file: ${RAG_F01_ROOT:?Prepare F01}/secrets/storage_admin_user
  storage_admin_password:
    file: ${RAG_F01_ROOT:?Prepare F01}/secrets/storage_admin_password

  postgres2_password:
    file: ${RAG_F01_ROOT:?Prepare F01}/secrets/postgres2_password
