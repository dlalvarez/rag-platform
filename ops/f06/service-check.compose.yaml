services:
  f06-service-check:
    extends:
      file: ../f05/embedding.compose.yaml
      service: embedding-worker
    profiles: [test]
    image: rag-f05-embedding:t008
    entrypoint: [python, /app/scripts/f06_service_check.py]
    volumes:
      - type: bind
        source: ../../src
        target: /app/src
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../../scripts
        target: /app/scripts
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F04_QA_ROOT:?Retained F04 API proof}
        target: /run/f04-qa
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F05_EMBED_QA_ROOT:?Verified Qwen proof}
        target: /run/f05-proof
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F06_SERVICE_QA_ROOT:?New private service journal}
        target: /run/f05-qa
        bind: {create_host_path: false}
