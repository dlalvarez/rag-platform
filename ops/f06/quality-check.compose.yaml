services:
  f06-quality-check:
    profiles:
    - test
    image: rag-f05-embedding:t008
    user: ${RAG_F02_UID:?Prepare F02}:${RAG_F02_GID:?Prepare F02}
    entrypoint:
    - python
    - scripts/f06_quality_check.py
    volumes:
    - type: bind
      source: /srv/rag-data/rag-platform/f01/secrets/postgres_password
      target: /run/secrets/postgres_password
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/rag-data/rag-platform/f01/secrets/postgres2_password
      target: /run/secrets/postgres2_password
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/rag-data/rag-platform/f01/secrets/control_migrator_password
      target: /run/secrets/control_migrator_password
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/rag-data/rag-platform/f01/tls/ca.crt
      target: /run/f01-ca.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../../src
      target: /app/src
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../../migrations
      target: /app/migrations
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../../scripts
      target: /app/scripts
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/rag-data/rag-platform/models/qwen3-embedding-0.6b/97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      target: /models/qwen3-embedding-0.6b/97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../../tests/fixtures/rag-eval
      target: /app/tests/fixtures/rag-eval
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${RAG_F06_QUALITY_QA_ROOT:?New private quality journal}
      target: /run/f05-qa
      bind:
        create_host_path: false
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=700,uid=${RAG_F02_UID:?Prepare F02},gid=${RAG_F02_GID:?Prepare
      F02}
    networks:
    - control
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 1.5
    mem_limit: 6g
    memswap_limit: 6g
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    pids_limit: 128
