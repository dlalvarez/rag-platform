[project]
name = "rag-f05-local-inference"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.7.1+cpu", "transformers==4.51.3", "safetensors==0.5.3"]

[tool.uv]
required-version = "==0.13.6"
constraint-dependencies = ["certifi==2026.10.23", "charset-normalizer==3.5.2", "filelock==4.2.6", "fsspec==2026.9.0", "hf-xet==1.8.0", "huggingface-hub==0.36.2", "idna==3.20", "jinja2==3.1.6", "markupsafe==3.0.4", "mpmath==1.3.0", "networkx==3.7", "numpy==2.5.4", "packaging==26.3", "pyyaml==6.0.3", "regex==2026.9.29", "requests==2.34.2", "setuptools==84.2.1", "sympy==1.14.0", "tokenizers==0.21.4", "tqdm==4.70.1", "typing-extensions==4.16.0", "urllib3==2.8.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
