services:
  f05-query-rpc-check:
    profiles: [test]
    image: rag-f05-tools:t006
    user: "${RAG_F02_UID:?Prepare F02}:${RAG_F02_GID:?Prepare F02}"
    entrypoint: [python, scripts/f05_query_rpc_check.py]
    environment:
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/identity_app_password
        target: /run/secrets/identity_app_password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/api_authority_key
        target: /run/secrets/api_authority_key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/rag-data/rag-platform/f01/tls/ca.crt
        target: /run/f01-ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /run/user/${RAG_F02_UID:?Prepare F02}/rag-f04-worker
        target: /run/f04-worker
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /run/user/${RAG_F02_UID:?Prepare F02}/rag-f05-query
        target: /run/f05-query
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F04_QA_ROOT:?Retained atomic manifest}
        target: /run/f04-qa
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F05_EMBED_QA_ROOT:?Verified atomic Qwen journal}
        target: /run/f05-proof
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F05_RPC_QA_ROOT:?New private RPC journal}
        target: /run/f05-qa
        bind: {create_host_path: false}
      - type: bind
        source: ../../src
        target: /app/src
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../../scripts
        target: /app/scripts
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    networks: [control]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128
    ulimits: {core: {soft: 0, hard: 0}}
