services:
  f05-retrieval-check:
    profiles:
    - test
    image: rag-f05-tools:t003
    user: ${RAG_F02_UID:?Prepare F02}:${RAG_F02_GID:?Prepare F02}
    entrypoint:
    - python
    - scripts/f05_retrieval_check.py
    volumes:
    - type: bind
      source: /srv/rag-data/rag-platform/f01/secrets/postgres_password
      target: /run/secrets/postgres_password
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/rag-data/rag-platform/f01/secrets/postgres2_password
      target: /run/secrets/postgres2_password
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/rag-data/rag-platform/f01/secrets/control_migrator_password
      target: /run/secrets/control_migrator_password
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/rag-data/rag-platform/f01/tls/ca.crt
      target: /run/f01-ca.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../../src
      target: /app/src
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../../migrations
      target: /app/migrations
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../../scripts/f05_publication_check.py
      target: /app/scripts/f05_publication_check.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ../../scripts/f05_retrieval_check.py
      target: /app/scripts/f05_retrieval_check.py
      read_only: true
      bind: {create_host_path: false}
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=8m
    networks:
    - control
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 0.5
    mem_limit: 768m
    memswap_limit: 768m
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: '1'
