name: rag-f02-dev
services:
  idp-postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: f02_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        install -o postgres -g postgres -m 600 /tls/idp-postgres.key /tmp/f02-postgres.key
        install -d -o postgres -g postgres -m 700 /docker-entrypoint-initdb.d
        install -o postgres -g postgres -m 600 /bootstrap/init.sql /docker-entrypoint-initdb.d/01-idp.sql
        exec /usr/local/bin/docker-entrypoint.sh postgres -c ssl=on -c ssl_min_protocol_version=TLSv1.3 -c ssl_cert_file=/tls/idp-postgres.crt -c ssl_key_file=/tmp/f02-postgres.key -c hba_file=/tls/pg_hba.conf -c max_connections=20 -c shared_buffers=64MB
    secrets: [postgres_password]
    volumes:
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/postgres
        target: /var/lib/postgresql/data
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/idp-postgres.crt
        target: /tls/idp-postgres.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/idp-postgres.key
        target: /tls/idp-postgres.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/pg_hba.conf
        target: /tls/pg_hba.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/config/init.sql
        target: /bootstrap/init.sql
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U f02_bootstrap -d postgres]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [f02]
    cpus: 0.25
    mem_limit: 512m
    memswap_limit: 512m
    ulimits: {core: {soft: 0, hard: 0}}
  idp:
    image: rag-f02-keycloak:26.8.1
    build:
      context: ../..
      dockerfile: ops/f02/keycloak.Dockerfile
    user: "${RAG_F02_UID:?Prepare F02}:${RAG_F02_GID:?Prepare F02}"
    command: [start, --optimized, --import-realm]
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx768m"
    depends_on:
      idp-postgres: {condition: service_healthy}
    volumes:
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/config/keycloak.conf
        target: /opt/keycloak/conf/keycloak.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/idp.crt
        target: /tls/idp.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/idp.key
        target: /tls/idp.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/ca.crt
        target: /tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../../ops/f02/realm.json
        target: /opt/keycloak/data/import/rag-dev-realm.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/config/token-fixture-realm.json
        target: /opt/keycloak/data/import/rag-dev-token-fixture-realm.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/config/identity-fixture-v2-realm.json
        target: /opt/keycloak/data/import/rag-dev-identity-fixture-v2-realm.json
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /opt/keycloak/data/tmp:rw,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [f02]
    cpus: 0.75
    mem_limit: 1536m
    memswap_limit: 1536m
    ulimits: {core: {soft: 0, hard: 0}}
  idp-check:
    profiles: [test]
    image: rag-f01-tools:daily-v1
    user: "${RAG_F02_UID:?Prepare F02}:${RAG_F02_GID:?Prepare F02}"
    entrypoint: [python, /check/f02_idp_check.py]
    volumes:
      - type: bind
        source: ../../scripts/f02_idp_check.py
        target: /check/f02_idp_check.py
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/ca.crt
        target: /tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [f02]
    cpus: 0.25
    mem_limit: 768m
    memswap_limit: 768m
    ulimits: {core: {soft: 0, hard: 0}}
  token-check:
    profiles: [test]
    image: rag-f02-tools:t002
    build:
      context: ../..
      dockerfile: ops/f02/tools.Dockerfile
    user: "${RAG_F02_UID:?Prepare F02}:${RAG_F02_GID:?Prepare F02}"
    entrypoint: [python, scripts/f02_token_check.py]
    volumes:
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/ca.crt
        target: /tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/token-fixture.json
        target: /run/secrets/token-fixture.json
        read_only: true
        bind: {create_host_path: false}
    networks: [f02]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 768m
    memswap_limit: 768m
    ulimits: {core: {soft: 0, hard: 0}}
  control-check:
    profiles: [test]
    image: rag-f02-tools:t003
    build:
      context: ../..
      dockerfile: ops/f02/tools.Dockerfile
    user: "${RAG_F02_UID:?Prepare F02}:${RAG_F02_GID:?Prepare F02}"
    entrypoint: [python, scripts/f02_control_check.py]
    volumes:
      - type: bind
        source: /srv/rag-data/rag-platform/f01/tls/ca.crt
        target: /run/f01-ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/rag-data/rag-platform/f01/secrets/postgres_password
        target: /run/secrets/postgres_password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/rag-data/rag-platform/f01/secrets/control_migrator_password
        target: /run/secrets/control_migrator_password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/identity_app_password
        target: /run/secrets/identity_app_password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/identity_admin_password
        target: /run/secrets/identity_admin_password
        read_only: true
        bind: {create_host_path: false}
    networks: [control]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 768m
    memswap_limit: 768m
    ulimits: {core: {soft: 0, hard: 0}}
  identity-cli:
    profiles: [admin]
    image: rag-f02-tools:t004
    build:
      context: ../..
      dockerfile: ops/f02/tools.Dockerfile
    user: "${RAG_F02_UID:?Prepare F02}:${RAG_F02_GID:?Prepare F02}"
    entrypoint: [python, scripts/f02_identity_admin.py]
    environment:
      RAG_OIDC_ISSUER: https://idp:8443/realms/rag-dev-identity-fixture-v2
      RAG_OIDC_AUDIENCE: rag-api
      RAG_OIDC_JWKS: https://idp:8443/realms/rag-dev-identity-fixture-v2/protocol/openid-connect/certs
    volumes:
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/ca.crt
        target: /tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/rag-data/rag-platform/f01/tls/ca.crt
        target: /run/f01-ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/identity_app_password
        target: /run/secrets/identity_app_password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/identity_admin_password
        target: /run/secrets/identity_admin_password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /run/user/${RAG_F02_UID:?Prepare F02}/rag-f02-auth
        target: /run/f02-auth
        bind: {create_host_path: false}
    networks: [f02, control]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 768m
    memswap_limit: 768m
    ulimits: {core: {soft: 0, hard: 0}}
  identity-bootstrap:
    extends: identity-cli
    profiles: [admin]
    volumes:
      - type: bind
        source: /run/user/${RAG_F02_UID:?Prepare F02}/rag-f01-access
        target: /run/f01-access
        bind: {create_host_path: false}
  cli-check:
    extends: identity-bootstrap
    profiles: [test]
    entrypoint: [python, scripts/f02_cli_check.py]
    volumes:
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/identity-fixture-v2.json
        target: /run/secrets/identity-fixture.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/rag-data/rag-platform/f01/secrets/control_migrator_password
        target: /run/secrets/control_migrator_password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/rag-data/rag-platform/f01/secrets/storage_admin_user
        target: /run/secrets/storage_admin_user
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/rag-data/rag-platform/f01/secrets/storage_admin_password
        target: /run/secrets/storage_admin_password
        read_only: true
        bind: {create_host_path: false}
  api:
    image: rag-f02-api:t005
    build:
      context: ../..
      dockerfile: ops/f02/api.Dockerfile
    user: "${RAG_F02_UID:?Prepare F02}:${RAG_F02_GID:?Prepare F02}"
    environment:
      RAG_OIDC_ISSUER: https://idp:8443/realms/rag-dev-identity-fixture-v2
      RAG_OIDC_AUDIENCE: rag-api
      RAG_OIDC_JWKS: https://idp:8443/realms/rag-dev-identity-fixture-v2/protocol/openid-connect/certs
    volumes:
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/ca.crt
        target: /tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/api.key
        target: /tls/api.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/api.crt
        target: /tls/api.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/rag-data/rag-platform/f01/tls/ca.crt
        target: /run/f01-ca.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/identity_app_password
        target: /run/secrets/identity_app_password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/api_authority_key
        target: /run/secrets/api_authority_key
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    networks: [f02, control]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 512m
    memswap_limit: 512m
    ulimits: {core: {soft: 0, hard: 0}}
  api-check:
    extends: identity-cli
    image: rag-f02-tools:t005
    entrypoint: [python, scripts/f02_api_check.py]
    volumes:
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/identity-fixture-v2.json
        target: /run/secrets/identity-fixture.json
        read_only: true
        bind: {create_host_path: false}

      - type: bind
        source: /srv/rag-data/rag-platform/f01/secrets/control_migrator_password
        target: /run/secrets/control_migrator_password
        read_only: true
        bind: {create_host_path: false}
  isolation-check:
    extends: cli-check
    image: rag-f02-tools:t006
    entrypoint: [python, scripts/f02_isolation_check.py]
    volumes:
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/secrets/api_authority_key
        target: /run/secrets/api_authority_key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/api.key
        target: /tls/api.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RAG_F02_ROOT:?Prepare F02}/tls/api.crt
        target: /tls/api.crt
        read_only: true
        bind: {create_host_path: false}
networks:
  f02: {internal: true}
  control:
    external: true
    name: rag-f01-dev_f01
secrets:
  postgres_password:
    file: ${RAG_F02_ROOT:?Prepare F02}/secrets/postgres_password
