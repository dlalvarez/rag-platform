[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rag-platform"
version = "0.0.1"
description = "F00 development scaffold; no business endpoints"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",
    "minio==7.2.20",
    "pyjwt[crypto]==2.15.1",
    "cryptography==50.0.2",
]

[tool.uv]
required-version = "==0.13.6"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/f00_*.py", "scripts/f01_*.py", "scripts/f02_*.py", "scripts/f03_*.py", "scripts/f04_*.py", "migrations/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "ruff==0.17.3",
]
